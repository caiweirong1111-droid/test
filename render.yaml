services:
  - type: web
    name: xianyu-mini-delivery
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: XIANYU_COOKIE_SHOP_A
        sync: false
